databases:
  - name: django-postgres-db
    databaseName: django_db        # ✅ underscores only
    user: django_user              # ✅ underscores only
    plan: free
    region: singapore

services:
  - type: web
    name: django-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"  # Replace 'backend' with your project name
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-postgres-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
    autoDeploy: true